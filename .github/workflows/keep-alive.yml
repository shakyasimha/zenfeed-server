name: Wake Up Render Server

on:
  schedule: 
    # Runs every 12 minutes
    - cron: '*/12 * * * *'
  workflow_dispatch:  # Allows manual trigger from Github Actions UI

jobs:
  ping: 
    runs-on: ubuntu-latest 
    steps: 
      - name: Send HTTP request to Render 
        run: |
          curl -I https://zenfeed-server.onrender.com/api/ping